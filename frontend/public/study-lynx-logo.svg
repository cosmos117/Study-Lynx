<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>

  <!-- Lynx head: pointed ears with tufts, broad cheeks -->
  <path d="M112 128 L186 212 Q256 190 326 212 L400 128 L408 262 L440 298 L406 306 Q412 352 340 386 Q300 406 256 408 Q212 406 172 386 Q100 352 106 306 L72 298 L104 262 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

  <!-- Eyes: amber almond shapes with indigo slit pupils -->
  <path d="M176 268 Q204 242 232 268 Q204 288 176 268 Z" fill="#F59E0B"/>
  <path d="M280 268 Q308 242 336 268 Q308 288 280 268 Z" fill="#F59E0B"/>
  <ellipse cx="204" cy="268" rx="4.5" ry="12" fill="#1E1B4B"/>
  <ellipse cx="308" cy="268" rx="4.5" ry="12" fill="#1E1B4B"/>

  <!-- Nose -->
  <path d="M242 306 L270 306 Q272 306 270 310 L258 322 Q256 324 254 322 L242 310 Q240 306 242 306 Z"
        fill="#4338CA" stroke="#4338CA" stroke-width="4" stroke-linejoin="round"/>

  <!-- Open book forming the muzzle / study cue -->
  <path d="M256 356 Q214 340 160 352 L160 398 Q214 386 256 402 Q298 386 352 398 L352 352 Q298 340 256 356 Z"
        fill="#F59E0B" stroke="#F59E0B" stroke-width="6" stroke-linejoin="round"/>
  <line x1="256" y1="356" x2="256" y2="402" stroke="#4338CA" stroke-width="7" stroke-linecap="round"/>
</svg>
